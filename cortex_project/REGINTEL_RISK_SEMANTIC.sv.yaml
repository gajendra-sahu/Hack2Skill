name: REGINTEL_RISK_SEMANTIC
description: This semantic view supports fraud detection and regulatory risk analytics
  for the RegIntel 360 platform. It models financial transactions at the individual
  transaction level and links them to automated risk alerts. It enables analysis of
  fraud patterns such as structuring and rapid velocity, risk scoring by customer,
  and transaction value breakdowns by country, channel, and merchant category.
tables:
- name: ALERTS
  base_table:
    database: REGINTEL360
    schema: RISK
    table: RISK_ALERTS
  primary_key:
    columns:
    - ALERT_ID
  dimensions:
  - name: ALERT_ID
    expr: ALERT_ID
    data_type: VARCHAR(16777216)
    access_modifier: public_access
    synonyms:
    - alert number
    - alert identifier
    description: Unique identifier for each risk alert. Primary key for alert-level
      analysis.
  - name: PATTERN
    expr: PATTERN
    data_type: VARCHAR(16777216)
    access_modifier: public_access
    synonyms:
    - fraud pattern
    - alert type
    - risk pattern
    - fraud type
    - structuring
    description: Classification of the detected fraud pattern. Values include STRUCTURING
      for threshold-avoidance behavior, RAPID_VELOCITY for unusually frequent transactions,
      and HIGH_RISK_MERCHANT for transactions with high-risk merchant categories.
    sample_values:
    - HIGH_RISK_MERCHANT
    - RAPID_VELOCITY
    - STRUCTURING
    is_enum: true
  facts:
  - name: RISK_SCORE
    expr: RISK_SCORE
    data_type: NUMBER(5,2)
    access_modifier: public_access
    synonyms:
    - risk level
    - fraud score
    - threat score
    - risk rating
    description: Numeric risk score assigned to the alert, ranging from 0 to 100.
      Higher values indicate greater likelihood of fraudulent activity. Used to identify
      highest-risk customers and prioritize compliance review.
  metrics:
  - name: ALERT_COUNT
    expr: COUNT(alerts.ALERT_ID)
    access_modifier: public_access
    synonyms:
    - number of alerts
    - total alerts
    - alert volume
    description: Total number of risk alerts generated. A single transaction may produce
      multiple alerts.
  - name: AVERAGE_RISK_SCORE
    expr: AVG(alerts.RISK_SCORE)
    access_modifier: public_access
    synonyms:
    - avg risk score
    - mean risk score
    - average risk
    - avg fraud score
    description: Average risk score across alerts. Higher averages indicate elevated
      risk exposure for the filtered population.
  description: Represents automated risk alerts generated by fraud detection rules.
    Each row corresponds to one alert raised against a specific transaction. A single
    transaction may produce multiple alerts if it matches more than one detection
    pattern.
- name: TRANSACTIONS
  base_table:
    database: REGINTEL360
    schema: RISK
    table: TRANSACTIONS
  primary_key:
    columns:
    - TRANSACTION_ID
  dimensions:
  - name: CHANNEL
    expr: CHANNEL
    data_type: VARCHAR(16777216)
    access_modifier: public_access
    synonyms:
    - transaction channel
    - payment channel
    - source channel
    description: The channel through which the transaction was initiated. Values are
      ONLINE, MOBILE, API, and BRANCH.
    sample_values:
    - API
    - BRANCH
    - MOBILE
    - ONLINE
    is_enum: true
  - name: COUNTRY
    expr: COUNTRY
    data_type: VARCHAR(16777216)
    access_modifier: public_access
    synonyms:
    - region
    - geography
    - country code
    - location
    description: Two-letter country code where the transaction originated. Used to
      segment transaction value and fraud rates by geography.
    sample_values:
    - AE
    - AU
    - CA
    - DE
    - FR
    - GB
    - IN
    - NL
    - SG
    - US
    is_enum: true
  - name: CURRENCY
    expr: CURRENCY
    data_type: VARCHAR(16777216)
    access_modifier: public_access
    synonyms:
    - ccy
    - currency code
    description: ISO currency code of the transaction amount. Values include USD,
      EUR, INR, SGD, and GBP.
    sample_values:
    - EUR
    - GBP
    - INR
    - SGD
    - USD
    is_enum: true
  - name: CUSTOMER_ID
    expr: CUSTOMER_ID
    data_type: VARCHAR(16777216)
    access_modifier: public_access
    synonyms:
    - customer
    - client id
    - account holder
    description: Identifier for the customer who initiated the transaction. Enables
      customer-level aggregation and risk profiling.
  - name: MERCHANT_CATEGORY
    expr: MERCHANT_CATEGORY
    data_type: VARCHAR(16777216)
    access_modifier: public_access
    synonyms:
    - merchant type
    - business category
    - mcc
    - merchant
    description: Business category of the merchant receiving the payment. High-risk
      categories such as CRYPTO, GAMING, and CASH_EQUIVALENT are key indicators in
      fraud pattern detection.
    sample_values:
    - CASH_EQUIVALENT
    - CHARITY
    - CRYPTO
    - ELECTRONICS
    - GAMING
    - JEWELRY
    - PROFESSIONAL_SERVICES
    - RETAIL
    - TRAVEL
    is_enum: true
  - name: TRANSACTION_ID
    expr: TRANSACTION_ID
    data_type: VARCHAR(16777216)
    access_modifier: public_access
    synonyms:
    - txn id
    - transaction number
    - txn
    description: Unique identifier for each financial transaction. Primary key for
      transaction-level analysis.
  - name: TRANSACTION_TS
    expr: TRANSACTION_TS
    data_type: TIMESTAMP_NTZ(9)
    access_modifier: public_access
    synonyms:
    - transaction date
    - transaction time
    - txn date
    description: Timestamp when the transaction was processed. Stored without time
      zone. Primary time reference for trend analysis and velocity detection.
  - name: LABEL
    description: Fraud classification assigned to the transaction. Values are NORMAL
      for legitimate activity, and STRUCTURING, RAPID_VELOCITY, or HIGH_RISK_MERCHANT
      for suspicious patterns.
    expr: LABEL
    data_type: VARCHAR
    synonyms:
    - fraud label
    - fraud classification
    - risk label
    - structuring flag
    - fraud flag
    sample_values:
    - HIGH_RISK_MERCHANT
    - NORMAL
    - RAPID_VELOCITY
    - STRUCTURING
    is_enum: true
  - name: PAYMENT_METHOD
    description: The payment instrument used for the transaction. Values include CARD,
      WIRE, SEPA, ACH, and UPI.
    expr: PAYMENT_METHOD
    data_type: VARCHAR
    synonyms:
    - payment type
    - payment rail
    - payment instrument
    sample_values:
    - ACH
    - CARD
    - SEPA
    - UPI
    - WIRE
    is_enum: true
  facts:
  - name: AMOUNT
    expr: AMOUNT
    data_type: NUMBER(18,2)
    access_modifier: public_access
    synonyms:
    - transaction value
    - transaction amount
    - payment amount
    - dollar amount
    description: Monetary value of the transaction. Used to calculate total exposure,
      average transaction size, and to identify structuring patterns where amounts
      cluster just below reporting thresholds.
  metrics:
  - name: TOTAL_AMOUNT
    expr: SUM(transactions.AMOUNT)
    access_modifier: public_access
    synonyms:
    - total transaction value
    - total spend
    - total volume
    - sum of amounts
    description: Total monetary value across all transactions. Fully additive across
      all dimensions.
  - name: TRANSACTION_COUNT
    expr: COUNT(transactions.TRANSACTION_ID)
    access_modifier: public_access
    synonyms:
    - number of transactions
    - txn count
    - total transactions
    description: Total number of transactions processed. Serves as the baseline denominator
      for fraud rate calculations.
  - name: FLAGGED_TRANSACTION_COUNT
    expr: COUNT_IF(LABEL <> 'NORMAL')
    description: Number of transactions classified as suspicious. Includes STRUCTURING,
      RAPID_VELOCITY, and HIGH_RISK_MERCHANT labels.
    synonyms:
    - flagged count
    - suspicious transactions
    - fraud count
  description: Represents individual financial transactions processed across all channels.
    Each row corresponds to one transaction by a single customer. Serves as the primary
    fact table for transaction volume, monetary exposure, and fraud-rate analysis.
relationships:
- name: TX_ALERT
  left_table: ALERTS
  right_table: TRANSACTIONS
  relationship_columns:
  - left_column: TRANSACTION_ID
    right_column: TRANSACTION_ID